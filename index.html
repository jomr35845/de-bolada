<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food App Clone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fff;
      color: #222;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Barra superior */
    .top-bar {
      background: #e53935;
      color: white;
      padding: 10px;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    /* Carrusel */
    .carousel {
      overflow: hidden;
      width: 100%;
      position: relative;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.3s ease-in-out;
    }

    .carousel-item {
      min-width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff8f2;
      padding: 20px;
    }

    .carousel-item img {
      max-width: 95%;
      border-radius: 15px;
    }

    /* Indicadores del carrusel */
    .indicators {
      display: flex;
      justify-content: center;
      margin: 8px 0;
    }

    .dot {
      height: 8px;
      width: 8px;
      margin: 0 4px;
      background-color: #bbb;
      border-radius: 50%;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .dot.active {
      background-color: #e53935;
      width: 16px;
      border-radius: 10px;
    }

    /* Sección marcas */
    .brands {
      padding: 15px;
    }

    .brands h2 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .brands-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .brand-card {
      background: #f9f9f9;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100px;
      border: 1px solid #eee;
      transition: transform 0.2s;
    }

    .brand-card:hover {
      transform: scale(1.05);
    }

    .brand-card img {
      max-height: 60px;
      max-width: 100px;
    }

    /* Navbar inferior */
    .bottom-nav {
      margin-top: auto;
      background: #fff;
      border-top: 1px solid #ddd;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      text-align: center;
      padding: 8px 0;
    }

    .bottom-nav div {
      font-size: 12px;
      color: #777;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .bottom-nav img {
      width: 22px;
      height: 22px;
    }

    .bottom-nav .active {
      color: #e53935;
      font-weight: bold;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Barra superior -->
  <div class="top-bar">
    Tipo de servicio: Recoger en restaurante
  </div>

  <!-- Carrusel -->
  <div class="carousel">
    <div class="carousel-track" id="carousel-track">
      <div class="carousel-item">
        <img src="https://inturfiles.s3.us-east-2.amazonaws.com/folder/products/500X500/PCK_vnp_combo_PET_senci-compressed_a0781b9.jpg" alt="Snack Box">
      </div>
      <div class="carousel-item">
        <img src="https://inturfiles.s3.us-east-2.amazonaws.com/folder/products/500X500/Imagen1_f5ea37e_48061c7_79bba6f.jpg" alt="Oferta 2">
      </div>
      <div class="carousel-item">
        <img src="https://inturfiles.s3.us-east-2.amazonaws.com/folder/products/500X500/1080x1080-armado_11zon_2287b74.jpg" alt="Oferta 3">
      </div>
    </div>
  </div>

  <!-- Indicadores -->
  <div class="indicators">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <!-- Marcas -->
  <div class="brands">
    <h2>Nuestras marcas</h2>
    <div class="brands-grid">
      <!-- Marcas originales -->
      <div class="brand-card"><img src="https://burgerkinghonduras.hn/logo.webp" alt="Burger King"></div>
      <div class="brand-card"><img src="https://littlecaesars.hn/logo.webp" alt="Little Caesars"></div>
      <div class="brand-card"><img src="https://popeyeshonduras.hn/logo.webp" alt="Popeyes"></div>
      <div class="brand-card"><img src="https://dunkin.hn/logo.webp" alt="Dunkin"></div>
      
      <!-- 11 nuevas marcas agregadas -->
      <div class="brand-card"><img src="https://campero.hn/logo.webp" alt="Subway"></div>
      <div class="brand-card"><img src="https://circlek.hn/logo.webp" alt="Domino's Pizza"></div>
      <div class="brand-card"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Pizza_Hut_international_logo_2014.svg/800px-Pizza_Hut_international_logo_2014.svg.png" alt="KFC"></div>
      <div class="brand-card"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/KFC_logo_wordmark.svg/330px-KFC_logo_wordmark.svg.png" alt="McDonald's"></div>
      <div class="brand-card"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Wendy%27s_logo_2012.svg/1920px-Wendy%27s_logo_2012.svg.png" alt="Taco Bell"></div>
      <div class="brand-card"><img src="https://lh3.googleusercontent.com/pw/AP1GczP2pW-jifczuG9t3Umj6ylGuhjKeIxadcBGNl3ICwsL8B4-gluOHEcT6H5S_vDDTEg-kyqvyNiCh5PcpNnUeeyYc9mAXgMtO5Ts4I6Tupx0blZgY15kDhFwynk8kYFyuLh0dyR4qNbKYavm89wSF6U=w849-h849-s-no-gm?authuser=0" alt="Starbucks"></div>
      <div class="brand-card"><img src="https://cocobaleadas.com//public/uploads/1698437152_3f88286a6c01af36d39d.png" alt="Pizza Hut"></div>
      <div class="brand-card"><img src="https://www.bigoshn.com/wp-content/uploads/2019/10/bgrande.png" alt="Wendy's"></div>
      <div class="brand-card"><img src="https://www.pollo-campesino.com/assets/images/logo_campesino_nuevo.9140953.jpg" alt="Baskin Robbins"></div>
      <div class="brand-card"><img src="https://novacentrohn.com/wp-content/uploads/2022/07/Espresso-Americano-600x600.jpg" alt="Sonic"></div>
      <div class="brand-card"><img src="https://lh3.googleusercontent.com/pw/AP1GczOtcBUCXsFDvimTtF5M8Wh0F00Vow-7f8OIUtLswyh9llDfz_vaNrl65-ywEQxZXE3_YbTcdBHZ63TG8amB7a3Q76NeFmzg4FLSh89tw_tdjppcgA8ZBhrwvEzggErVADWp7GEba_b_TK_kZ7NLw1E=w715-h715-s-no-gm?authuser=0" alt="Chipotle"></div>
      <div class="brand-card"><img src="https://lh3.googleusercontent.com/pw/AP1GczO7kEwKlLEkOXYKPeNhjzkqqKPdVZdoIRUNwsLHvw_EXT1pKaKKd2pQY5uEcUwFbSz6nhhOj-jPLAplORgONbKpnXZ0V-Dd2aDMIrMwatUFq7-SbL07o9dKxT5uwkiC3sG2nU98yoosNDHvfdLECwY=w715-h715-s-no-gm?authuser=0" alt="Arby's"></div>
      <div class="brand-card"><img src="https://pollolandia.com/gt/templates/pollolandia/images/logoPollolandia.png" alt="Jimmy John's"></div>
      <div class="brand-card"><img src="https://pollopirulonhn.com/wp-content/uploads/2023/01/Pollo-pirulon.png" alt="Papa John's"></div>
      <div class="brand-card"><img src="https://pollopirulonhn.com/wp-content/uploads/2023/01/Pollo-pirulon.png" alt="Jack in the Box"></div>
    </div>
  </div>

  <!-- Navegación inferior -->
  <div class="bottom-nav">
    <div class="active">
      <i class="fa-solid fa-house"></i>
      Inicio
    </div>
    <div>
      <i class="fa-solid fa-bag-shopping"></i>
      Pedidos
    </div>
    <div>
      <i class="fa-solid fa-heart"></i>
      Favoritos
    </div>
    <div>
      <i class="fa-brands fa-whatsapp"></i>
      Ayuda
    </div>
    <div>
      <i class="fa-solid fa-user"></i>
      Perfil
    </div>
  </div>

  <script>
    // Carrusel automático
    const track = document.getElementById("carousel-track");
    const dots = document.querySelectorAll(".dot");
    let index = 0;

    setInterval(() => {
      index = (index + 1) % track.children.length;
      track.style.transform = `translateX(-${index * 100}%)`;

      dots.forEach((d, i) => d.classList.toggle("active", i === index));
    }, 4000);
  </script>
</body>
</html>
